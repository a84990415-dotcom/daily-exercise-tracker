<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>일일 운동 목표 트래커</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2563eb" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  :root{
    --bg:#0f172a;
    --card:#1e293b;
    --card2:#273449;
    --accent:#2563eb;
    --accent2:#3b82f6;
    --good:#22c55e;
    --mid:#eab308;
    --bad:#475569;
    --text:#e2e8f0;
    --sub:#94a3b8;
    --danger:#ef4444;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;}
  body{padding-bottom:72px;min-height:100vh;}
  h1,h2,h3{margin:0 0 8px 0;}
  .container{max-width:480px;margin:0 auto;padding:16px 14px 8px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;max-width:480px;margin:0 auto;}
  .topbar h1{font-size:18px;}
  .datebar{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 14px;}
  .datebar button{background:var(--card2);border:none;color:var(--text);border-radius:8px;padding:8px 12px;font-size:16px;}
  .datebar .label{font-size:15px;font-weight:600;min-width:150px;text-align:center;}
  .banner{background:#7c2d12;border:1px solid #f97316;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;line-height:1.5;}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;}
  .card.full{border:1px solid var(--good);}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .card-head .title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bad);color:var(--text);}
  .badge.full{background:var(--good);color:#06240f;}
  .badge.part{background:var(--mid);color:#241d00;}
  .sub-row{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid #334155;}
  .sub-row:first-of-type{border-top:none;}
  .sub-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .sub-label{font-size:13.5px;color:var(--text);}
  .sub-target{color:var(--sub);font-size:12px;margin-left:4px;white-space:nowrap;}
  .sub-controls{display:flex;align-items:center;justify-content:flex-end;gap:10px;}
  .check{width:30px;height:30px;border-radius:8px;border:2px solid #475569;background:transparent;display:flex;align-items:center;justify-content:center;font-size:16px;color:transparent;flex-shrink:0;}
  .check.on{background:var(--good);border-color:var(--good);color:#06240f;}
  .numctrl{display:flex;align-items:center;gap:8px;}
  .numctrl button{width:34px;height:34px;border:1px solid #475569;border-radius:8px;background:var(--card2);color:var(--text);font-size:18px;font-weight:700;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  .numctrl button:active{background:var(--accent);border-color:var(--accent);color:white;}
  .numctrl input{width:58px;text-align:center;background:var(--card2);border:1px solid #475569;border-radius:7px;color:var(--text);font-size:14px;padding:6px 0;}
  .timerbtn{background:var(--accent);border:none;color:white;border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap;}
  .timerbtn.running{background:var(--danger);}
  .note{font-size:11px;color:var(--sub);margin-top:6px;}
  textarea.memo{width:100%;background:var(--card2);border:none;border-radius:8px;color:var(--text);padding:8px;font-size:13px;resize:vertical;min-height:40px;}
  .streakbar{display:flex;gap:10px;margin-bottom:12px;}
  .streakbox{flex:1;background:var(--card);border-radius:12px;padding:10px;text-align:center;}
  .streakbox .num{font-size:20px;font-weight:800;color:var(--accent2);}
  .streakbox .lbl{font-size:11px;color:var(--sub);margin-top:2px;}
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:#111827;border-top:1px solid #1f2937;display:flex;max-width:480px;margin:0 auto;}
  .tabbar button{flex:1;background:none;border:none;color:var(--sub);padding:10px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .tabbar button.active{color:var(--accent2);}
  .tabbar .ic{font-size:18px;}
  .goal-group{margin-bottom:18px;}
  .goal-group h3{font-size:14px;color:var(--accent2);}
  .goal-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid #334155;}
  .goal-row:first-of-type{border-top:none;}
  .goal-row .glabel{font-size:13.5px;}
  .goal-row input[type=number]{width:70px;background:var(--card2);border:none;border-radius:7px;color:var(--text);padding:6px;text-align:center;font-size:14px;}
  .goal-row input[type=time]{background:var(--card2);border:none;border-radius:7px;color:var(--text);padding:6px;font-size:14px;}
  .btn{display:block;width:100%;background:var(--accent);border:none;color:white;border-radius:10px;padding:12px;font-size:14px;font-weight:600;margin-top:10px;}
  .btn.secondary{background:var(--card2);}
  .btn.danger{background:var(--danger);}
  .pillrow{display:flex;gap:8px;margin-bottom:14px;}
  .pill{flex:1;background:var(--card2);border:none;color:var(--sub);border-radius:999px;padding:8px 0;font-size:13px;font-weight:600;}
  .pill.active{background:var(--accent);color:white;}
  .statrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #334155;font-size:13px;}
  .statrow:first-of-type{border-top:none;}
  .statrow .rate{font-weight:700;color:var(--accent2);}
  .bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin:10px 0;}
  .bars .barwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .bars .bar{width:100%;border-radius:4px 4px 0 0;background:var(--accent2);min-height:2px;}
  .bars .barlbl{font-size:10px;color:var(--sub);}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0;}
  .cal .d{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text);}
  .legend{display:flex;gap:10px;font-size:11px;color:var(--sub);margin-top:4px;align-items:center;flex-wrap:wrap;}
  .legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;}
  .monthnav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:8px;}
  .monthnav button{background:var(--card2);border:none;color:var(--text);border-radius:8px;padding:6px 12px;}
  .monthnav .lbl{font-weight:700;font-size:14px;min-width:90px;text-align:center;}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#0f172a;border:1px solid var(--accent2);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.4);}
  .hidden{display:none !important;}
  .filebtnrow{display:flex;gap:8px;}
  .filebtnrow .btn{margin-top:0;}
  .small{font-size:11px;color:var(--sub);}
</style>
</head>
<body>

<div class="topbar">
  <h1>🏋️ 운동 목표 트래커</h1>
</div>

<div class="container" id="view"></div>

<div class="tabbar">
  <button data-tab="home" class="active"><span class="ic">🏠</span>오늘</button>
  <button data-tab="goal"><span class="ic">🎯</span>목표</button>
  <button data-tab="stats"><span class="ic">📊</span>통계</button>
  <button data-tab="settings"><span class="ic">⚙️</span>설정</button>
</div>

<script>
/* ===================== 데이터 ===================== */
const STORAGE_KEY = "exerciseTrackerData_v1";

const DEFAULT_GOALS = {
  stretch: { base_min: 5, raise_count: 50, squat_count: 50, deadhang_sec: 30 },
  stairs: { floors: 10 },
  walk: { steps: 10000 },
  pullup: { deadhang_sec: 30, active_sec: 30 }
};
const DEFAULT_ALARMS = { morning: "08:00", evening1: "17:00", evening2: "22:00", enabled: true };

function defaultData(){
  return { goals: JSON.parse(JSON.stringify(DEFAULT_GOALS)), alarms: JSON.parse(JSON.stringify(DEFAULT_ALARMS)), logs: {} };
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    const d = defaultData();
    d.goals.stretch = Object.assign(d.goals.stretch, parsed.goals && parsed.goals.stretch);
    d.goals.stairs = Object.assign(d.goals.stairs, parsed.goals && parsed.goals.stairs);
    d.goals.walk = Object.assign(d.goals.walk, parsed.goals && parsed.goals.walk);
    d.goals.pullup = Object.assign(d.goals.pullup, parsed.goals && parsed.goals.pullup);
    d.alarms = Object.assign(d.alarms, parsed.alarms);
    d.logs = parsed.logs || {};
    return d;
  }catch(e){
    console.warn("데이터 로드 실패, 기본값 사용", e);
    return defaultData();
  }
}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }

let DATA = loadData();

function blankLog(){
  return {
    stretch: { base_min:0, raise_count:0, squat_count:0, deadhang_sec:0 },
    stairs: { floors:0 },
    walk: { steps:0 },
    pullup: { deadhang_sec:0, active_sec:0 },
    memo: ""
  };
}
function getLog(dateKey){
  if(!DATA.logs[dateKey]) return blankLog();
  const b = blankLog();
  const l = DATA.logs[dateKey];
  return {
    stretch: Object.assign(b.stretch, l.stretch),
    stairs: Object.assign(b.stairs, l.stairs),
    walk: Object.assign(b.walk, l.walk),
    pullup: Object.assign(b.pullup, l.pullup),
    memo: l.memo || ""
  };
}
function setLog(dateKey, log){
  DATA.logs[dateKey] = log;
  saveData();
}

/* ===================== 날짜 유틸 ===================== */
function toKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function keyToDate(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function todayKey(){ return toKey(new Date()); }
function addDays(key, n){ const d=keyToDate(key); d.setDate(d.getDate()+n); return toKey(d); }
function fmtLabel(key){
  const d = keyToDate(key);
  const wd = ["일","월","화","수","목","금","토"][d.getDay()];
  const t = todayKey();
  if(key===t) return `오늘 (${d.getMonth()+1}/${d.getDate()} ${wd})`;
  if(key===addDays(t,-1)) return `어제 (${d.getMonth()+1}/${d.getDate()} ${wd})`;
  return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} (${wd})`;
}

/* ===================== 달성도 계산 ===================== */
// 값/목표 비율 (0~1, 목표 이상이면 1)
function frac(value, target){
  if(!target || target<=0) return value>0 ? 1 : 0;
  return Math.min(1, value/target);
}
function stretchFraction(log, goals){
  const g=goals.stretch, l=log.stretch;
  return (frac(l.base_min,g.base_min)+frac(l.raise_count,g.raise_count)+frac(l.squat_count,g.squat_count)+frac(l.deadhang_sec,g.deadhang_sec))/4;
}
function stairsFraction(log, goals){ return frac(log.stairs.floors, goals.stairs.floors); }
function walkFraction(log, goals){ return frac(log.walk.steps, goals.walk.steps); }
function pullupFraction(log, goals){
  const g=goals.pullup, l=log.pullup;
  return (frac(l.deadhang_sec,g.deadhang_sec)+frac(l.active_sec,g.active_sec))/2;
}
function categoryFractions(log, goals){
  return { stretch: stretchFraction(log,goals), stairs: stairsFraction(log,goals), walk: walkFraction(log,goals), pullup: pullupFraction(log,goals) };
}
function dayOverallFraction(log, goals){
  const f = categoryFractions(log, goals);
  return (f.stretch+f.stairs+f.walk+f.pullup)/4;
}
function dayFullCount(log, goals){
  const f = categoryFractions(log, goals);
  return [f.stretch,f.stairs,f.walk,f.pullup].filter(v=>v>=1).length;
}

const CAT_LABEL = { stretch:"기상 스트레칭", stairs:"계단 오르기", walk:"1만보 걷기", pullup:"퇴근 후 철봉" };
const CAT_ICON = { stretch:"🙆", stairs:"🪜", walk:"🚶", pullup:"🧗" };

/* ===================== 화면 상태 ===================== */
let currentTab = "home";
let currentDateKey = todayKey();
let statsPeriod = "week"; // week | month | year
let statsMonthCursor = new Date(); // for month view
let statsYearCursor = new Date().getFullYear();
let activeTimers = {}; // key -> intervalId

const view = document.getElementById("view");

/* ===================== 홈 탭 ===================== */
function renderHome(){
  const log = getLog(currentDateKey);
  const goals = DATA.goals;
  const isToday = currentDateKey === todayKey();
  const canGoNext = currentDateKey < todayKey();

  let html = "";

  html += `<div class="datebar">
    <button data-act="prevday">◀</button>
    <div class="label">${fmtLabel(currentDateKey)}</div>
    <button data-act="nextday" ${canGoNext? "" : "disabled style=\"opacity:.3\""}>▶</button>
  </div>`;

  if(isToday){
    const reminders = getDueReminders(log, goals);
    if(reminders.length){
      html += `<div class="banner">⏰ ${reminders.join("<br>⏰ ")}</div>`;
    }
  }

  const streak = computeStreak();
  html += `<div class="streakbar">
    <div class="streakbox"><div class="num">${streak.current}일</div><div class="lbl">현재 연속 달성</div></div>
    <div class="streakbox"><div class="num">${streak.longest}일</div><div class="lbl">최장 연속 달성</div></div>
  </div>`;

  // 기상 스트레칭
  const sFull = stretchFraction(log, goals) >= 1;
  html += `<div class="card ${sFull?'full':''}">
    <div class="card-head"><div class="title">${CAT_ICON.stretch} ${CAT_LABEL.stretch}</div>${badgeHtml(stretchFraction(log,goals))}</div>
    ${renderSubRow("stretch-base", log, goals)}
    ${renderSubRow("stretch-raise", log, goals)}
    ${renderSubRow("stretch-squat", log, goals)}
    ${renderSubRow("stretch-deadhang", log, goals)}
  </div>`;

  // 계단 오르기
  const stFull = stairsFraction(log, goals) >= 1;
  html += `<div class="card ${stFull?'full':''}">
    <div class="card-head"><div class="title">${CAT_ICON.stairs} ${CAT_LABEL.stairs}</div>${badgeHtml(stairsFraction(log,goals))}</div>
    ${renderSubRow("stairs-floors", log, goals)}
  </div>`;

  // 1만보 걷기
  const wFull = walkFraction(log,goals) >= 1;
  html += `<div class="card ${wFull?'full':''}">
    <div class="card-head"><div class="title">${CAT_ICON.walk} ${CAT_LABEL.walk}</div>${badgeHtml(walkFraction(log,goals))}</div>
    ${renderSubRow("walk-steps", log, goals)}
  </div>`;

  // 퇴근 후 철봉
  const pFull = pullupFraction(log, goals) >= 1;
  html += `<div class="card ${pFull?'full':''}">
    <div class="card-head"><div class="title">${CAT_ICON.pullup} ${CAT_LABEL.pullup}</div>${badgeHtml(pullupFraction(log,goals))}</div>
    ${renderSubRow("pullup-deadhang", log, goals)}
    ${renderSubRow("pullup-active", log, goals)}
  </div>`;

  html += `<div class="card">
    <div class="card-head"><div class="title">📝 메모</div></div>
    <textarea class="memo" id="memoInput" placeholder="오늘 특이사항 (예: 출장, 부상 등)">${escapeHtml(log.memo)}</textarea>
  </div>`;

  view.innerHTML = html;

  // 이벤트 바인딩
  view.querySelectorAll("[data-act=prevday]").forEach(b=>b.onclick=()=>{ currentDateKey = addDays(currentDateKey,-1); renderHome(); });
  view.querySelectorAll("[data-act=nextday]").forEach(b=>b.onclick=()=>{ if(canGoNext){ currentDateKey = addDays(currentDateKey,1); renderHome(); } });

  view.querySelectorAll("[data-check]").forEach(el=>{
    el.onclick = ()=>{
      const id = el.getAttribute("data-check");
      toggleCheck(id);
    };
  });
  view.querySelectorAll("[data-timer]").forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); startOrStopTimer(el.getAttribute("data-timer")); };
  });
  view.querySelectorAll("[data-numbtn]").forEach(el=>{
    el.onclick = ()=>{
      const [id, delta] = el.getAttribute("data-numbtn").split("|");
      const def = SUBDEFS[id];
      const log = getLog(currentDateKey);
      log[def.cat][def.logKey] = Math.max(0, log[def.cat][def.logKey] + parseInt(delta,10));
      setLog(currentDateKey, log);
      renderHome();
    };
  });
  view.querySelectorAll("[data-numinput]").forEach(el=>{
    const id = el.getAttribute("data-numinput");
    const def = SUBDEFS[id];
    el.oninput = ()=>{
      const digits = el.value.replace(/[^0-9]/g,"");
      if(el.value !== digits) el.value = digits;
      const log = getLog(currentDateKey);
      log[def.cat][def.logKey] = digits==="" ? 0 : Math.max(0, parseInt(digits,10));
      setLog(currentDateKey, log);
    };
    el.onblur = ()=> renderHome();
    el.onkeydown = (e)=>{
      if(["-","+","e","E","."].includes(e.key)) e.preventDefault();
    };
  });
  const memoInput = document.getElementById("memoInput");
  if(memoInput){
    memoInput.onblur = ()=>{
      const log = getLog(currentDateKey);
      log.memo = memoInput.value;
      setLog(currentDateKey, log);
    };
  }
}

function badgeHtml(frac){
  if(frac>=1) return `<span class="badge full">완전달성</span>`;
  if(frac>0) return `<span class="badge part">부분달성</span>`;
  return `<span class="badge">미달성</span>`;
}

/* 운동 세부 항목 정의: 모든 항목을 "숫자 입력(실측값) vs 목표값" 한 가지 방식으로 통일 */
const SUBDEFS = {
  "stretch-base":     { cat:"stretch", logKey:"base_min",    goalKey:"base_min",    label:"기본 스트레칭", unit:"분", step:1,   timerUnit:"min" },
  "stretch-raise":    { cat:"stretch", logKey:"raise_count", goalKey:"raise_count", label:"만세운동",       unit:"회", step:5 },
  "stretch-squat":    { cat:"stretch", logKey:"squat_count", goalKey:"squat_count", label:"스쿼트",         unit:"회", step:5 },
  "stretch-deadhang": { cat:"stretch", logKey:"deadhang_sec",goalKey:"deadhang_sec",label:"철봉 데드행",     unit:"초", step:5,   timerUnit:"sec" },
  "stairs-floors":    { cat:"stairs",  logKey:"floors",      goalKey:"floors",      label:"오른 층수",       unit:"층", step:1 },
  "walk-steps":       { cat:"walk",    logKey:"steps",       goalKey:"steps",       label:"걸음 수",         unit:"보", step:500 },
  "pullup-deadhang":  { cat:"pullup",  logKey:"deadhang_sec",goalKey:"deadhang_sec",label:"데드행",         unit:"초", step:5,   timerUnit:"sec" },
  "pullup-active":    { cat:"pullup",  logKey:"active_sec",  goalKey:"active_sec",  label:"액티브행",       unit:"초", step:5,   timerUnit:"sec" }
};
function subValue(log, def){ return log[def.cat][def.logKey]; }
function subTarget(goals, def){ return goals[def.cat][def.goalKey]; }

function renderSubRow(id, log, goals){
  const def = SUBDEFS[id];
  const value = subValue(log, def);
  const target = subTarget(goals, def);
  const achieved = target>0 ? value>=target : value>0;
  const timerBtn = def.timerUnit ? `<button type="button" class="timerbtn" data-timer="${id}">⏱</button>` : "";
  return `<div class="sub-row">
    <div class="sub-top">
      <span class="sub-label">${def.label}</span>
      <span class="sub-target">목표 ${target}${def.unit}</span>
    </div>
    <div class="sub-controls">
      ${timerBtn}
      <div class="numctrl">
        <button type="button" data-numbtn="${id}|-${def.step}">−</button>
        <input type="number" class="numfield" data-numinput="${id}" value="${value}" min="0" step="${def.step}" inputmode="numeric" pattern="[0-9]*" />
        <button type="button" data-numbtn="${id}|${def.step}">+</button>
      </div>
      <div class="check ${achieved?'on':''}" data-check="${id}">✓</div>
    </div>
  </div>`;
}

function toggleCheck(id){
  const def = SUBDEFS[id];
  const goals = DATA.goals;
  const target = subTarget(goals, def);
  const log = getLog(currentDateKey);
  const cur = subValue(log, def);
  log[def.cat][def.logKey] = (target>0 && cur>=target) ? 0 : target;
  setLog(currentDateKey, log);
  renderHome();
}

/* 타이머: 완료되면 해당 항목 값이 목표값으로 자동 입력됨(보조 입력 수단) */
function startOrStopTimer(id){
  const def = SUBDEFS[id];
  const target = subTarget(DATA.goals, def);
  const sec = def.timerUnit === "min" ? target*60 : target;
  const btnSel = `[data-timer="${id}"]`;
  if(activeTimers[id]){
    clearInterval(activeTimers[id].interval);
    delete activeTimers[id];
    renderHome();
    return;
  }
  let remaining = sec;
  const btn = view.querySelector(btnSel);
  if(btn){ btn.textContent = `⏸ ${remaining}`; btn.classList.add("running"); }
  const interval = setInterval(()=>{
    remaining--;
    const b = view.querySelector(btnSel);
    if(b) b.textContent = `⏸ ${remaining}`;
    if(remaining<=0){
      clearInterval(interval);
      delete activeTimers[id];
      const log = getLog(currentDateKey);
      log[def.cat][def.logKey] = target;
      setLog(currentDateKey, log);
      playBeep();
      renderHome();
    }
  }, 1000);
  activeTimers[id] = { interval };
}
function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.frequency.value = 880;
    osc.connect(ctx.destination);
    osc.start();
    setTimeout(()=>{ osc.stop(); ctx.close(); }, 250);
  }catch(e){}
}

/* 연속달성(streak) 계산 */
function computeStreak(){
  const dates = Object.keys(DATA.logs).sort();
  let longest=0, run=0;
  // 날짜 전체 범위를 훑어 완전달성(4/4) 연속일수 측정
  if(dates.length){
    let cursor = dates[0];
    const last = todayKey();
    while(cursor <= last){
      const log = DATA.logs[cursor] ? getLog(cursor) : null;
      const full = log ? dayFullCount(log, DATA.goals)===4 : false;
      if(full){ run++; longest = Math.max(longest, run); } else { run=0; }
      cursor = addDays(cursor,1);
    }
  }
  // 오늘로부터 역순으로 현재 연속일수
  let current=0;
  let cursor = todayKey();
  while(true){
    const l = DATA.logs[cursor];
    if(!l) break;
    const full = dayFullCount(getLog(cursor), DATA.goals)===4;
    if(!full) break;
    current++;
    cursor = addDays(cursor,-1);
  }
  return { current, longest };
}

/* 알림 due 체크 (오늘자) */
const ALARM_CATS = { morning:["stretch","stairs"], evening1:["stairs","walk"], evening2:["pullup"] };
function getDueReminders(log, goals){
  if(!DATA.alarms.enabled) return [];
  const now = new Date();
  const nowStr = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const msgs = [];
  Object.keys(ALARM_CATS).forEach(key=>{
    const t = DATA.alarms[key];
    if(!t) return;
    if(nowStr >= t){
      const cats = ALARM_CATS[key];
      const fr = categoryFractions(log, goals);
      const incomplete = cats.filter(c=>fr[c]<1).map(c=>CAT_LABEL[c]);
      if(incomplete.length){
        msgs.push(`${t} 알림 — ${incomplete.join(", ")} 아직 미완료`);
      }
    }
  });
  return msgs;
}

function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ===================== 통계 탭 ===================== */
function renderStats(){
  let html = `<div class="pillrow">
    <button class="pill ${statsPeriod==='week'?'active':''}" data-period="week">주간</button>
    <button class="pill ${statsPeriod==='month'?'active':''}" data-period="month">월간</button>
    <button class="pill ${statsPeriod==='year'?'active':''}" data-period="year">연간</button>
  </div>`;

  if(statsPeriod==="week"){
    html += renderWeekStats();
  }else if(statsPeriod==="month"){
    html += renderMonthStats();
  }else{
    html += renderYearStats();
  }

  view.innerHTML = html;
  view.querySelectorAll("[data-period]").forEach(b=>{
    b.onclick = ()=>{ statsPeriod = b.getAttribute("data-period"); renderStats(); };
  });
  bindStatsNav();
}

function bindStatsNav(){
  const prevM = document.getElementById("monthPrev");
  const nextM = document.getElementById("monthNext");
  if(prevM) prevM.onclick = ()=>{ statsMonthCursor.setMonth(statsMonthCursor.getMonth()-1); renderStats(); };
  if(nextM) nextM.onclick = ()=>{ statsMonthCursor.setMonth(statsMonthCursor.getMonth()+1); renderStats(); };
  const prevY = document.getElementById("yearPrev");
  const nextY = document.getElementById("yearNext");
  if(prevY) prevY.onclick = ()=>{ statsYearCursor--; renderStats(); };
  if(nextY) nextY.onclick = ()=>{ statsYearCursor++; renderStats(); };
}

function aggregate(dateKeys){
  const goals = DATA.goals;
  const cats = ["stretch","stairs","walk","pullup"];
  const result = {};
  cats.forEach(c=>result[c] = { daysFull:0, total:dateKeys.length, sumFrac:0 });
  let stepsSum=0, stepsDays=0, raiseSum=0, squatSum=0, loggedDays=0;
  dateKeys.forEach(k=>{
    const has = !!DATA.logs[k];
    const log = getLog(k);
    if(has) loggedDays++;
    const fr = categoryFractions(log, goals);
    cats.forEach(c=>{
      result[c].sumFrac += fr[c];
      if(fr[c]>=1) result[c].daysFull++;
    });
    if(has){
      stepsSum += log.walk.steps; stepsDays++;
      raiseSum += log.stretch.raise_count;
      squatSum += log.stretch.squat_count;
    }
  });
  return { cats:result, stepsAvg: stepsDays? Math.round(stepsSum/stepsDays):0, raiseAvg: loggedDays? Math.round(raiseSum/loggedDays):0, squatAvg: loggedDays? Math.round(squatSum/loggedDays):0, loggedDays, totalDays:dateKeys.length };
}

function statTable(agg){
  const cats = ["stretch","stairs","walk","pullup"];
  let rows = cats.map(c=>{
    const d = agg.cats[c];
    const rate = d.total? Math.round(d.sumFrac/d.total*100):0;
    return `<div class="statrow"><div>${CAT_ICON[c]} ${CAT_LABEL[c]}</div><div>완전달성 ${d.daysFull}/${d.total}일 · <span class="rate">${rate}%</span></div></div>`;
  }).join("");
  return `<div class="card">${rows}
    <div class="statrow"><div>평균 걸음 수</div><div class="rate">${agg.stepsAvg.toLocaleString()}보</div></div>
    <div class="statrow"><div>평균 만세운동</div><div class="rate">${agg.raiseAvg}회</div></div>
    <div class="statrow"><div>평균 스쿼트</div><div class="rate">${agg.squatAvg}회</div></div>
  </div>`;
}

function renderWeekStats(){
  const keys = [];
  for(let i=6;i>=0;i--) keys.push(addDays(todayKey(),-i));
  const agg = aggregate(keys);

  let bars = `<div class="card"><h3 style="font-size:13px;color:var(--sub);">최근 7일 종합 달성도</h3><div class="bars">`;
  keys.forEach(k=>{
    const log = getLog(k);
    const frac = dayOverallFraction(log, DATA.goals);
    const d = keyToDate(k);
    const wd = ["일","월","화","수","목","금","토"][d.getDay()];
    bars += `<div class="barwrap"><div class="bar" style="height:${Math.max(3,frac*84)}px;background:${frac>=1? 'var(--good)':'var(--accent2)'}"></div><div class="barlbl">${wd}</div></div>`;
  });
  bars += `</div></div>`;

  return bars + statTable(agg);
}

function renderMonthStats(){
  const y = statsMonthCursor.getFullYear(), m = statsMonthCursor.getMonth();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const firstDow = new Date(y, m, 1).getDay();
  const keys = [];
  for(let d=1; d<=daysInMonth; d++) keys.push(toKey(new Date(y,m,d)));
  const agg = aggregate(keys.filter(k=>k<=todayKey()));

  let nav = `<div class="monthnav"><button id="monthPrev">◀</button><div class="lbl">${y}년 ${m+1}월</div><button id="monthNext">▶</button></div>`;

  let cal = `<div class="card">${nav}<div class="cal">`;
  for(let i=0;i<firstDow;i++) cal += `<div class="d"></div>`;
  keys.forEach(k=>{
    const d = keyToDate(k);
    if(k>todayKey()){
      cal += `<div class="d" style="background:#1a2333;color:#334155;">${d.getDate()}</div>`;
    }else{
      const log = getLog(k);
      const frac = dayOverallFraction(log, DATA.goals);
      const color = frac>=1? "var(--good)" : frac>0.5? "#4d7c0f" : frac>0 ? "#78350f" : "#1f2937";
      cal += `<div class="d" style="background:${color};">${d.getDate()}</div>`;
    }
  });
  cal += `</div><div class="legend">
    <span><span class="sw" style="background:var(--good);"></span>완전</span>
    <span><span class="sw" style="background:#4d7c0f;"></span>절반이상</span>
    <span><span class="sw" style="background:#78350f;"></span>일부</span>
    <span><span class="sw" style="background:#1f2937;"></span>없음</span>
  </div></div>`;

  return cal + statTable(agg);
}

function renderYearStats(){
  const y = statsYearCursor;
  const nav = `<div class="monthnav"><button id="yearPrev">◀</button><div class="lbl">${y}년</div><button id="yearNext">▶</button></div>`;
  const monthRates = [];
  for(let m=0;m<12;m++){
    const daysInMonth = new Date(y,m+1,0).getDate();
    const keys = [];
    for(let d=1; d<=daysInMonth; d++){
      const k = toKey(new Date(y,m,d));
      if(k<=todayKey()) keys.push(k);
    }
    if(keys.length===0){ monthRates.push(null); continue; }
    const agg = aggregate(keys);
    const cats = ["stretch","stairs","walk","pullup"];
    const avg = cats.reduce((s,c)=>s+agg.cats[c].sumFrac,0) / (keys.length*4);
    monthRates.push(avg);
  }
  let bars = `<div class="card">${nav}<h3 style="font-size:13px;color:var(--sub);">월별 종합 달성률</h3><div class="bars">`;
  monthRates.forEach((r,i)=>{
    const h = r===null? 2 : Math.max(3, r*84);
    bars += `<div class="barwrap"><div class="bar" style="height:${h}px;background:${r!==null && r>=1?'var(--good)':'var(--accent2)'}"></div><div class="barlbl">${i+1}월</div></div>`;
  });
  bars += `</div></div>`;

  const allKeys = [];
  for(let m=0;m<12;m++){
    const daysInMonth = new Date(y,m+1,0).getDate();
    for(let d=1; d<=daysInMonth; d++){
      const k = toKey(new Date(y,m,d));
      if(k<=todayKey()) allKeys.push(k);
    }
  }
  const agg = aggregate(allKeys);
  return bars + statTable(agg);
}

function exportData(){
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `exercise-tracker-backup-${todayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.logs || !parsed.goals) throw new Error("형식 오류");
      DATA = parsed;
      saveData();
      showToast("가져오기 완료되었습니다.");
      renderSettings();
    }catch(err){
      alert("파일을 읽을 수 없습니다. 올바른 백업 파일인지 확인하세요.");
    }
  };
  reader.readAsText(file);
}

function showToast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

    btn.classList.add("active");
    currentTab = btn.getAttribute("data-tab");
    renderCurrent();

function renderCurrent(){
  if(currentTab==="home") renderHome();
  else if(currentTab==="goal") renderGoal();
  else if(currentTab==="stats") renderStats();
  else renderSettings();
}

/* ===================== 알림 예약 (탭이 열려있는 동안) ===================== */
let scheduledTimeouts = [];
function scheduleTodayNotifications(){
  scheduledTimeouts.forEach(t=>clearTimeout(t));
  scheduledTimeouts = [];
  if(!("Notification" in window) || Notification.permission!=="granted" || !DATA.alarms.enabled) return;
  const now = new Date();
  Object.keys(ALARM_CATS).forEach(key=>{
    const t = DATA.alarms[key];
    if(!t) return;
    const [hh,mm] = t.split(":").map(Number);
    const target = new Date();
    target.setHours(hh,mm,0,0);
    const diff = target.getTime() - now.getTime();
    if(diff>0 && diff < 24*3600*1000){
      const id = setTimeout(()=>{
        const log = getLog(todayKey());
        const cats = ALARM_CATS[key];
        const fr = categoryFractions(log, DATA.goals);
        const incomplete = cats.filter(c=>fr[c]<1).map(c=>CAT_LABEL[c]);
        if(incomplete.length){
          fireNotification("운동 목표 알림", incomplete.join(", ") + " 체크해주세요!");
        }
        if(currentTab==="home") renderHome();
      }, diff);
      scheduledTimeouts.push(id);
    }
  });
}
function fireNotification(title, body){
  if(navigator.serviceWorker && navigator.serviceWorker.ready){
    navigator.serviceWorker.ready.then(reg=>{
      if(reg.showNotification) reg.showNotification(title, {body, icon:"icons/icon-192.png"});
      else new Notification(title, {body});
    }).catch(()=> { try{ new Notification(title,{body}); }catch(e){} });
  }else{
    try{ new Notification(title, {body}); }catch(e){}
  }
}

/* ===================== 초기화 ===================== */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW 등록 실패(파일을 서버에 올려 사용하세요):", e));
  });
}
scheduleTodayNotifications();
